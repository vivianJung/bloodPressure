<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>혈압 측정 및 기록</title>
  <link rel="stylesheet" href="style.css">
  <!-- 차트 라이브러리 -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- 이미지 텍스트 인식(OCR) 라이브러리 -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>
<body>

  <!-- 상단 헤더 -->
  <header class="app-header">
    <h1>❤️ 혈압 측정 및 기록</h1>
  </header>

  <!-- 상단 탭 메뉴 -->
  <nav class="tab-menu">
    <button class="tab-btn active" onclick="openTab('tab-input')">📷 측정/입력</button>
    <button class="tab-btn" onclick="openTab('tab-list')">📋 기록 보기</button>
    <button class="tab-btn" onclick="openTab('tab-calendar')">📅 달력 보기</button>
    <button class="tab-btn" onclick="openTab('tab-chart')">📈 차트 보기</button>
    <button class="tab-btn" onclick="openTab('tab-settings')">⚙️ 폰트 설정</button>
  </nav>

  <main class="container">

    <!-- 1. 혈압 측정/입력 탭 -->
    <section id="tab-input" class="tab-content active">
      <div class="card">
        <h3>📷 혈압계 촬영 / 자동 인식</h3>
        <div class="btn-group">
          <label for="cameraInput" class="icon-btn">📷 카메라로 촬영</label>
          <input type="file" id="cameraInput" accept="image/*" capture="environment" onchange="processImage(event)">
          
          <label for="galleryInput" class="icon-btn">🖼️ 갤러리 선택</label>
          <input type="file" id="galleryInput" accept="image/*" onchange="processImage(event)">
        </div>

        <!-- 이미지 및 안내 문구 -->
        <div class="image-preview-box">
          <canvas id="imageCanvas"></canvas>
          <p id="imageStatusHint">혈압계 사진을 선택하면 숫자를 자동으로 읽어옵니다.</p>
        </div>

        <!-- 입력 폼 -->
        <div class="input-grid">
          <div class="input-item">
            <label>수축기 (SYS)</label>
            <input type="number" id="sysInput" placeholder="--">
            <span>mmHg</span>
          </div>
          <div class="input-item">
            <label>이완기 (DIA)</label>
            <input type="number" id="diaInput" placeholder="--">
            <span>mmHg</span>
          </div>
          <div class="input-item">
            <label>맥박 (PULSE)</label>
            <input type="number" id="pulseInput" placeholder="--">
            <span>/min</span>
          </div>
        </div>

        <button class="save-btn" onclick="saveRecord()">💾 데이터 저장하기</button>
      </div>
    </section>

    <!-- 2. 기록 보기 탭 -->
    <section id="tab-list" class="tab-content">
      <div class="card">
        <div class="card-header-flex">
          <h3>📋 측정 기록 목록</h3>
          <button class="danger-btn" onclick="clearAllData()">전체 삭제</button>
        </div>
        <ul id="recordList" class="record-list"></ul>
      </div>
    </section>

    <!-- 3. 달력 보기 탭 -->
    <section id="tab-calendar" class="tab-content">
      <div class="card">
        <h3>📅 월별 혈압 달력</h3>
        <div id="calendarView"></div>
      </div>
    </section>

    <!-- 4. 선형 차트 보기 탭 -->
    <section id="tab-chart" class="tab-content">
      <div class="card">
        <h3>📈 혈압 변화 추이</h3>
        <canvas id="bpChart"></canvas>
      </div>
    </section>

    <!-- 5. 폰트 설정 탭 -->
    <section id="tab-settings" class="tab-content">
      <div class="card">
        <h3>⚙️ 앱 글꼴 및 크기 설정</h3>
        <div class="setting-item">
          <label for="fontSizeSelect">글자 크기:</label>
          <select id="fontSizeSelect" onchange="changeFontSize(this.value)">
            <option value="14px">작게</option>
            <option value="16px" selected>보통</option>
            <option value="18px">크게</option>
            <option value="20px">매우 크게</option>
          </select>
        </div>
      </div>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>

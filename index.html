<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>혈압 관리 매니저</title>
  
  <!-- iOS PWA 웹앱 설정 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="혈압노트">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2966/2966327.png">

  <!-- Tailwind CSS & Lucide Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Tesseract.js (카메라 OCR) -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

  <style>
    :root {
      --app-font-scale: 100%;
    }
    html {
      font-size: var(--app-font-scale);
    }
    body {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 pb-24 font-sans min-h-screen">

  <!-- 상단 헤더 -->
  <header class="sticky top-0 bg-white/80 backdrop-blur-md border-b border-slate-200 z-30 px-4 py-3 flex justify-between items-center">
    <h1 class="text-lg font-bold text-slate-900 flex items-center gap-2">
      <i data-lucide="heart-pulse" class="text-rose-500"></i> 혈압 노트
    </h1>
    <button onclick="checkBackupReminder(true)" class="p-2 text-slate-500 hover:text-slate-800">
      <i data-lucide="bell"></i>
    </button>
  </header>

  <!-- 메인 컨텐츠 영역 -->
  <main class="max-w-md mx-auto p-4 space-y-6">

    <!-- TAB 1: 데이터 입력 -->
    <section id="tab-input" class="tab-content">
      <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-100 space-y-4">
        <h2 class="text-base font-bold text-slate-700 flex items-center gap-1.5">
          <i data-lucide="plus-circle" class="w-5 h-5 text-blue-500"></i> 혈압 데이터 입력
        </h2>

        <!-- 카메라 OCR 버튼 -->
        <div class="bg-blue-50/70 border border-blue-100 rounded-xl p-4 text-center space-y-2">
          <p class="text-xs text-blue-600 font-medium">혈압계 화면 촬영으로 자동 입력</p>
          <label class="inline-flex items-center justify-center gap-2 w-full py-3 bg-blue-600 text-white rounded-xl font-semibold shadow-md active:scale-95 transition cursor-pointer">
            <i data-lucide="camera"></i> 카메라 / 사진 선택
            <input type="file" id="cameraInput" accept="image/*" capture="environment" class="hidden" onchange="processImageOCR(this)">
          </label>
          <div id="ocrSpinner" class="hidden text-xs text-blue-600 font-medium flex items-center justify-center gap-2 pt-1">
            <i data-lucide="loader-2" class="animate-spin w-4 h-4"></i> 이미지를 분석 중입니다...
          </div>
        </div>

        <!-- 수동 입력 폼 -->
        <form id="bpForm" onsubmit="saveRecord(event)" class="space-y-3 pt-2">
          <input type="hidden" id="editId" value="">
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="text-xs text-slate-500 font-medium">날짜</label>
              <input type="date" id="inputDate" required class="w-full mt-1 p-2.5 bg-slate-100 rounded-xl border-none text-sm font-semibold text-slate-700">
            </div>
            <div>
              <label class="text-xs text-slate-500 font-medium">시간</label>
              <input type="time" id="inputTime" required class="w-full mt-1 p-2.5 bg-slate-100 rounded-xl border-none text-sm font-semibold text-slate-700">
            </div>
          </div>

          <div class="grid grid-cols-3 gap-2 pt-1">
            <div>
              <label class="text-xs text-blue-600 font-bold">수축기 (SYS)</label>
              <input type="number" id="inputSys" placeholder="120" required class="w-full mt-1 p-3 bg-blue-50 text-blue-900 font-bold text-lg rounded-xl border border-blue-200 text-center">
            </div>
            <div>
              <label class="text-xs text-rose-600 font-bold">이완기 (DIA)</label>
              <input type="number" id="inputDia" placeholder="80" required class="w-full mt-1 p-3 bg-rose-50 text-rose-900 font-bold text-lg rounded-xl border border-rose-200 text-center">
            </div>
            <div>
              <label class="text-xs text-amber-600 font-bold">맥박 (Pulse)</label>
              <input type="number" id="inputPulse" placeholder="70" required class="w-full mt-1 p-3 bg-amber-50 text-amber-900 font-bold text-lg rounded-xl border border-amber-200 text-center">
            </div>
          </div>

          <div class="pt-1">
            <label class="text-xs text-slate-500 font-medium">측정 시점 구분</label>
            <div class="grid grid-cols-3 gap-2 mt-1">
              <button type="button" onclick="setTag('아침')" class="tag-btn p-2 text-xs border rounded-lg font-semibold border-slate-200 text-slate-600" data-tag="아침">☀️ 아침</button>
              <button type="button" onclick="setTag('저녁')" class="tag-btn p-2 text-xs border rounded-lg font-semibold border-slate-200 text-slate-600" data-tag="저녁">🌙 저녁</button>
              <button type="button" onclick="setTag('기타')" class="tag-btn p-2 text-xs border rounded-lg font-semibold border-slate-200 text-slate-600" data-tag="기타">✏️ 기타</button>
            </div>
          </div>

          <button type="submit" id="submitBtn" class="w-full py-3.5 bg-slate-900 text-white rounded-xl font-bold shadow-md hover:bg-slate-800 transition active:scale-95 pt-3">
            기록 저장하기
          </button>
        </form>
      </div>
    </section>

    <!-- TAB 2: 차트 보기 -->
    <section id="tab-chart" class="tab-content hidden space-y-4">
      <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100">
        <div class="flex justify-between items-center mb-3">
          <h2 class="text-sm font-bold text-slate-700">혈압 추이 차트</h2>
          <div class="flex gap-1 text-xs">
            <button onclick="setChartPeriod(7)" class="period-btn px-2.5 py-1 rounded-md bg-blue-100 text-blue-700 font-bold" data-period="7">1주</button>
            <button onclick="setChartPeriod(30)" class="period-btn px-2.5 py-1 rounded-md bg-slate-100 text-slate-600" data-period="30">1달</button>
            <button onclick="setChartPeriod(60)" class="period-btn px-2.5 py-1 rounded-md bg-slate-100 text-slate-600" data-period="60">2달</button>
            <button onclick="setChartPeriod(90)" class="period-btn px-2.5 py-1 rounded-md bg-slate-100 text-slate-600" data-period="90">3달</button>
          </div>
        </div>
        <div class="relative h-64 w-full">
          <canvas id="bpChart"></canvas>
        </div>
      </div>
    </section>

    <!-- TAB 3: 달력 보기 -->
    <section id="tab-calendar" class="tab-content hidden space-y-4">
      <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100">
        <div class="flex justify-between items-center mb-4">
          <button onclick="changeMonth(-1)" class="p-1"><i data-lucide="chevron-left"></i></button>
          <h2 id="calendarTitle" class="text-base font-bold text-slate-800">2026년 10월</h2>
          <button onclick="changeMonth(1)" class="p-1"><i data-lucide="chevron-right"></i></button>
        </div>
        <div class="grid grid-cols-7 gap-1 text-center text-xs font-semibold text-slate-400 mb-2">
          <div class="text-rose-500">일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div>
        </div>
        <div id="calendarGrid" class="grid grid-cols-7 gap-1 text-center text-sm"></div>
      </div>
      <div id="calendarDetail" class="space-y-2"></div>
    </section>

    <!-- TAB 4: 리스트 보기 -->
    <section id="tab-list" class="tab-content hidden space-y-3">
      <div class="flex justify-between items-center px-1">
        <h2 class="text-sm font-bold text-slate-700">전체 기록 목록</h2>
        <span id="recordCount" class="text-xs text-slate-500 font-medium">총 0건</span>
      </div>
      <div id="recordList" class="space-y-2.5"></div>
    </section>

    <!-- TAB 5: 백업 및 설정 -->
    <section id="tab-settings" class="tab-content hidden space-y-4">
      <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 space-y-4">
        <h2 class="text-sm font-bold text-slate-700 flex items-center gap-1.5">
          <i data-lucide="settings"></i> 앱 설정 & 백업
        </h2>

        <!-- 글자 크기 조정 -->
        <div class="space-y-2 border-b border-slate-100 pb-4">
          <label class="text-xs font-semibold text-slate-600">화면 글자 크기 조정</label>
          <div class="flex items-center gap-3">
            <span class="text-xs">작게</span>
            <input type="range" id="fontScaleRange" min="90" max="115" step="5" value="100" oninput="changeFontScale(this.value)" class="w-full accent-blue-600">
            <span class="text-sm font-bold">크게</span>
          </div>
        </div>

        <!-- 데이터 백업/전송 -->
        <div class="space-y-2">
          <label class="text-xs font-semibold text-slate-600">데이터 백업 내보내기</label>
          <div class="grid grid-cols-2 gap-2">
            <button onclick="backupViaEmail()" class="flex items-center justify-center gap-2 p-3 bg-slate-100 rounded-xl text-xs font-bold text-slate-700 hover:bg-slate-200">
              <i data-lucide="mail" class="w-4 h-4"></i> 이메일 전송
            </button>
            <button onclick="backupViaNotes()" class="flex items-center justify-center gap-2 p-3 bg-amber-50 text-amber-800 rounded-xl text-xs font-bold hover:bg-amber-100">
              <i data-lucide="file-text" class="w-4 h-4"></i> 메모장 복사
            </button>
          </div>
        </div>

        <!-- 백업 알림 확인 -->
        <div class="pt-2">
          <button onclick="checkBackupReminder(true)" class="w-full p-2.5 border border-slate-200 text-slate-600 text-xs rounded-xl font-medium">
            백업 상태 확인하기
          </button>
        </div>
      </div>
    </section>

  </main>

  <!-- 하단 탭 바 -->
  <nav class="fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur-md border-t border-slate-200 z-40">
    <div class="max-w-md mx-auto grid grid-cols-5 text-center py-2 text-slate-400">
      <button onclick="switchTab('input')" id="nav-input" class="nav-btn text-blue-600 flex flex-col items-center gap-0.5">
        <i data-lucide="plus-circle" class="w-5 h-5"></i>
        <span class="text-[10px] font-medium">입력</span>
      </button>
      <button onclick="switchTab('chart')" id="nav-chart" class="nav-btn flex flex-col items-center gap-0.5">
        <i data-lucide="line-chart" class="w-5 h-5"></i>
        <span class="text-[10px] font-medium">차트</span>
      </button>
      <button onclick="switchTab('calendar')" id="nav-calendar" class="nav-btn flex flex-col items-center gap-0.5">
        <i data-lucide="calendar" class="w-5 h-5"></i>
        <span class="text-[10px] font-medium">달력</span>
      </button>
      <button onclick="switchTab('list')" id="nav-list" class="nav-btn flex flex-col items-center gap-0.5">
        <i data-lucide="list" class="w-5 h-5"></i>
        <span class="text-[10px] font-medium">목록</span>
      </button>
      <button onclick="switchTab('settings')" id="nav-settings" class="nav-btn flex flex-col items-center gap-0.5">
        <i data-lucide="settings" class="w-5 h-5"></i>
        <span class="text-[10px] font-medium">설정</span>
      </button>
    </div>
  </nav>

  <!-- JS 로직 -->
  <script>
    // State
    let records = JSON.parse(localStorage.getItem('bp_records') || '[]');
    let currentTag = '아침';
    let chartInstance = null;
    let chartPeriod = 7;
    let currentDate = new Date();

    // Init
    window.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      resetFormDateTime();
      setTag('아침');
      renderList();
      checkBackupReminder(false);
      
      const savedScale = localStorage.getItem('bp_font_scale');
      if (savedScale) {
        changeFontScale(savedScale);
        document.getElementById('fontScaleRange').value = savedScale;
      }
    });

    function resetFormDateTime() {
      const now = new Date();
      document.getElementById('inputDate').value = now.toISOString().split('T')[0];
      document.getElementById('inputTime').value = now.toTimeString().slice(0, 5);
    }

    function switchTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
      document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('text-blue-600'));
      
      document.getElementById(`tab-${tabId}`).classList.remove('hidden');
      document.getElementById(`nav-${tabId}`).classList.add('text-blue-600');

      if (tabId === 'chart') renderChart();
      if (tabId === 'calendar') renderCalendar();
      if (tabId === 'list') renderList();
    }

    function setTag(tag) {
      currentTag = tag;
      document.querySelectorAll('.tag-btn').forEach(btn => {
        if (btn.dataset.tag === tag) {
          btn.className = 'tag-btn p-2 text-xs border rounded-lg font-semibold bg-blue-600 text-white border-blue-600';
        } else {
          btn.className = 'tag-btn p-2 text-xs border rounded-lg font-semibold border-slate-200 text-slate-600';
        }
      });
    }

    // --- 1단계: 카메라 OCR 인식 ---
    async function processImageOCR(input) {
      if (!input.files || !input.files[0]) return;
      const file = input.files[0];
      const spinner = document.getElementById('ocrSpinner');
      spinner.classList.remove('hidden');

      try {
        const worker = await Tesseract.createWorker('eng');
        await worker.setParameters({ tessedit_char_whitelist: '0123456789\n ' });
        const { data: { text } } = await worker.recognize(file);
        await worker.terminate();

        const numbers = text.match(/\b\d{2,3}\b/g)?.map(Number) || [];
        
        // OMRON 혈압계 기준 3개 숫자 순서 (SYS > DIA > PULSE)
        if (numbers.length >= 3) {
          document.getElementById('inputSys').value = numbers[0];
          document.getElementById('inputDia').value = numbers[1];
          document.getElementById('inputPulse').value = numbers[2];
          alert(`숫자를 자동 인식했습니다!\n수축기: ${numbers[0]}, 이완기: ${numbers[1]}, 맥박: ${numbers[2]}`);
        } else {
          alert("숫자 인식에 실패했습니다. 사진이 명확하도록 다시 카메라로 찍어주세요.");
        }
      } catch (err) {
        alert("인식 처리 중 오류가 발생했습니다. 다시 촬영하거나 직접 입력해 주세요.");
      } finally {
        spinner.classList.add('hidden');
        input.value = '';
      }
    }

    // --- 데이터 저장 & 수정 & 삭제 ---
    function saveRecord(e) {
      e.preventDefault();
      const editId = document.getElementById('editId').value;
      const date = document.getElementById('inputDate').value;
      const time = document.getElementById('inputTime').value;
      const sys = parseInt(document.getElementById('inputSys').value);
      const dia = parseInt(document.getElementById('inputDia').value);
      const pulse = parseInt(document.getElementById('inputPulse').value);

      if (editId) {
        if (!confirm("정말 수정하시겠습니까?")) return;
        const idx = records.findIndex(r => r.id === editId);
        if (idx !== -1) {
          records[idx] = { id: editId, date, time, sys, dia, pulse, tag: currentTag };
        }
        document.getElementById('editId').value = '';
        document.getElementById('submitBtn').innerText = '기록 저장하기';
      } else {
        const newRecord = {
          id: Date.now().toString(),
          date, time, sys, dia, pulse, tag: currentTag
        };
        records.push(newRecord);
      }

      records.sort((a, b) => new Date(`${b.date}T${b.time}`) - new Date(`${a.date}T${a.time}`));
      localStorage.setItem('bp_records', JSON.stringify(records));
      
      alert('성공적으로 저장되었습니다.');
      document.getElementById('bpForm').reset();
      resetFormDateTime();
      setTag('아침');
      renderList();
    }

    function editRecord(id) {
      const target = records.find(r => r.id === id);
      if (!target) return;
      
      document.getElementById('editId').value = target.id;
      document.getElementById('inputDate').value = target.date;
      document.getElementById('inputTime').value = target.time;
      document.getElementById('inputSys').value = target.sys;
      document.getElementById('inputDia').value = target.dia;
      document.getElementById('inputPulse').value = target.pulse;
      setTag(target.tag || '기타');
      document.getElementById('submitBtn').innerText = '수정 완료하기';
      switchTab('input');
    }

    function deleteRecord(id) {
      if (confirm("정말 삭제하시겠습니까?")) {
        records = records.filter(r => r.id !== id);
        localStorage.setItem('bp_records', JSON.stringify(records));
        renderList();
        if (!document.getElementById('tab-chart').classList.contains('hidden')) renderChart();
      }
    }

    function getBPStatus(sys, dia) {
      if (sys >= 140 || dia >= 90) return { text: '고혈압', color: 'text-rose-600 bg-rose-50' };
      if (sys >= 120 || dia >= 80) return { text: '주의', color: 'text-amber-600 bg-amber-50' };
      if (sys < 90 || dia < 60) return { text: '저혈압', color: 'text-blue-600 bg-blue-50' };
      return { text: '정상', color: 'text-emerald-600 bg-emerald-50' };
    }

    // --- 2단계: 추이 분석 차트 ---
    function setChartPeriod(days) {
      chartPeriod = days;
      document.querySelectorAll('.period-btn').forEach(btn => {
        if (parseInt(btn.dataset.period) === days) {
          btn.className = 'period-btn px-2.5 py-1 rounded-md bg-blue-100 text-blue-700 font-bold';
        } else {
          btn.className = 'period-btn px-2.5 py-1 rounded-md bg-slate-100 text-slate-600';
        }
      });
      renderChart();
    }

    function renderChart() {
      const ctx = document.getElementById('bpChart').getContext('2d');
      const now = new Date();
      const limitDate = new Date();
      limitDate.setDate(now.getDate() - chartPeriod);

      const filtered = records
        .filter(r => new Date(r.date) >= limitDate)
        .sort((a, b) => new Date(`${a.date}T${a.time}`) - new Date(`${b.date}T${b.time}`));

      const labels = filtered.map(r => r.date.slice(5) + ' ' + r.time);
      const sysData = filtered.map(r => r.sys);
      const diaData = filtered.map(r => r.dia);
      const pulseData = filtered.map(r => r.pulse);

      if (chartInstance) chartInstance.destroy();

      chartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          labels,
          datasets: [
            { label: '수축기(SYS)', data: sysData, borderColor: '#3b82f6', backgroundColor: '#3b82f6', tension: 0.3 },
            { label: '이완기(DIA)', data: diaData, borderColor: '#ef4444', backgroundColor: '#ef4444', tension: 0.3 },
            { label: '맥박(Pulse)', data: pulseData, borderColor: '#f59e0b', backgroundColor: '#f59e0b', tension: 0.3 }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { position: 'bottom' } },
          scales: { y: { min: 40, max: 180 } }
        }
      });
    }

    // --- 달력 보기 ---
    function changeMonth(delta) {
      currentDate.setMonth(currentDate.getMonth() + delta);
      renderCalendar();
    }

    function renderCalendar() {
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();
      document.getElementById('calendarTitle').innerText = `${year}년 ${month + 1}월`;

      const firstDay = new Date(year, month, 1).getDay();
      const lastDate = new Date(year, month + 1, 0).getDate();
      const grid = document.getElementById('calendarGrid');
      grid.innerHTML = '';

      for (let i = 0; i < firstDay; i++) {
        grid.innerHTML += `<div></div>`;
      }

      for (let day = 1; day <= lastDate; day++) {
        const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const dayRecords = records.filter(r => r.date === dateStr);
        let dotHTML = '';
        
        if (dayRecords.length > 0) {
          const hasHigh = dayRecords.some(r => r.sys >= 140 || r.dia >= 90);
          dotHTML = `<span class="inline-block w-1.5 h-1.5 rounded-full ${hasHigh ? 'bg-rose-500' : 'bg-emerald-500'} mt-0.5"></span>`;
        }

        grid.innerHTML += `
          <button onclick="showCalendarDetail('${dateStr}')" class="p-2 hover:bg-slate-100 rounded-xl flex flex-col items-center">
            <span>${day}</span>
            ${dotHTML}
          </button>
        `;
      }
    }

    function showCalendarDetail(dateStr) {
      const dayRecords = records.filter(r => r.date === dateStr);
      const detailContainer = document.getElementById('calendarDetail');
      
      if (dayRecords.length === 0) {
        detailContainer.innerHTML = `<p class="text-xs text-slate-400 text-center py-2">${dateStr} 기록이 없습니다.</p>`;
        return;
      }

      detailContainer.innerHTML = dayRecords.map(r => {
        const st = getBPStatus(r.sys, r.dia);
        return `
          <div class="bg-white p-3 rounded-xl border border-slate-100 flex justify-between items-center text-xs">
            <div>
              <span class="font-bold text-slate-700">${r.time} (${r.tag || '미지정'})</span>
              <p class="text-slate-500 mt-0.5">${r.sys}/${r.dia} mmHg · ${r.pulse} bpm</p>
            </div>
            <span class="px-2 py-1 rounded-md font-bold ${st.color}">${st.text}</span>
          </div>
        `;
      }).join('');
    }

    // --- 순서별 리스트 보기 ---
    function renderList() {
      const listContainer = document.getElementById('recordList');
      document.getElementById('recordCount').innerText = `총 ${records.length}건`;

      if (records.length === 0) {
        listContainer.innerHTML = `<p class="text-center text-xs text-slate-400 py-8">등록된 혈압 기록이 없습니다.</p>`;
        return;
      }

      listContainer.innerHTML = records.map(r => {
        const status = getBPStatus(r.sys, r.dia);
        return `
          <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 flex justify-between items-center">
            <div class="space-y-1">
              <div class="flex items-center gap-2">
                <span class="text-xs text-slate-400 font-medium">${r.date} ${r.time}</span>
                <span class="text-[10px] px-1.5 py-0.5 rounded font-semibold bg-slate-100 text-slate-600">${r.tag || '미지정'}</span>
              </div>
              <div class="text-xl font-black text-slate-800">
                ${r.sys}<span class="text-slate-400 font-normal text-sm">/</span>${r.dia}
                <span class="text-xs font-normal text-slate-500 ml-1">mmHg</span>
                <span class="text-xs font-normal text-slate-400 ml-2">❤️ ${r.pulse} bpm</span>
              </div>
            </div>
            <div class="flex items-center gap-2">
              <span class="px-2.5 py-1 rounded-lg text-xs font-bold ${status.color}">${status.text}</span>
              <button onclick="editRecord('${r.id}')" class="p-1.5 text-slate-400 hover:text-blue-600"><i data-lucide="edit-2" class="w-4 h-4"></i></button>
              <button onclick="deleteRecord('${r.id}')" class="p-1.5 text-slate-400 hover:text-rose-600"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
            </div>
          </div>
        `;
      }).join('');
      lucide.createIcons();
    }

    // --- 3단계: 백업 & 설정 ---
    function changeFontScale(val) {
      document.documentElement.style.setProperty('--app-font-scale', `${val}%`);
      localStorage.setItem('bp_font_scale', val);
    }

    function checkBackupReminder(manual = false) {
      const lastBackup = localStorage.getItem('bp_last_backup_date');
      const now = new Date();
      let needBackup = false;

      if (!lastBackup) {
        if (records.length > 0) needBackup = true;
      } else {
        const diffDays = (now - new Date(lastBackup)) / (1000 * 60 * 60 * 24);
        if (diffDays >= 30) needBackup = true;
      }

      if (needBackup || manual) {
        if (confirm(`백업할 시간입니다! 1달 이상 데이터가 모였거나 백업점검이 필요합니다.\n지금 데이터를 백업하시겠습니까?`)) {
          switchTab('settings');
        }
      }
    }

    function formatBackupText() {
      return records.map(r => `${r.date} ${r.time} [${r.tag || '기타'}] 수축기:${r.sys} 이완기:${r.dia} 맥박:${r.pulse}`).join('\n');
    }

    function backupViaEmail() {
      const body = encodeURIComponent("혈압 관리 앱 데이터 백업입니다.\n\n" + formatBackupText());
      window.location.href = `mailto:?subject=혈압데이터 백업&body=${body}`;
      localStorage.setItem('bp_last_backup_date', new Date().toISOString());
    }

    function backupViaNotes() {
      const text = formatBackupText();
      if (navigator.share) {
        navigator.share({ title: '혈압 데이터 백업', text: text });
      } else {
        navigator.clipboard.writeText(text);
        alert('혈압 데이터가 클립보드에 복사되었습니다. 메모장 앱에 붙여넣어 주세요.');
      }
      localStorage.setItem('bp_last_backup_date', new Date().toISOString());
    }
  </script>
</body>
</html>
